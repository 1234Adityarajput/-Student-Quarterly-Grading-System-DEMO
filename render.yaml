services:
  - type: web
    name: sqgs-grading-system
    runtime: docker
    plan: free
    branch: main
    dockerContext: .
    dockerfilePath: Dockerfile
    healthCheckPath: /login.php
    envVars:
      - key: DB_SERVER
        sync: false
      - key: DB_PORT
        value: "26284"
      - key: DB_USERNAME
        value: "avnadmin"
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: "defaultdb"
      - key: DB_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
